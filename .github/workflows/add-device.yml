name: Add unofficial device

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Two labels can arrive in quick succession (template labels fire `labeled` on
# creation). Serialise per issue so only one branch/PR is ever opened.
concurrency:
  group: add-device-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add-device:
    if: |
      github.event.label.name == 'add-device' &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse the issue form
        id: parse
        continue-on-error: true
        env:
          ISSUE_CONTENT: ${{ github.event.issue.body }}
        run: python3 .github/add_device_handler.py docs/repos.json

      - name: Commit the entry
        if: steps.parse.outcome == 'success' && steps.parse.outputs.changed == 'true'
        env:
          REPO: ${{ steps.parse.outputs.repo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repos.json
          git commit -m "add device: $REPO"

      - name: Open a pull request
        id: pr
        if: steps.parse.outcome == 'success' && steps.parse.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: add-device-${{ github.event.issue.number }}
          delete-branch: true
          labels: add-device
          title: "[add device]: ${{ steps.parse.outputs.repo }}"
          commit-message: "add device: ${{ steps.parse.outputs.repo }}"
          body: |
            Adds [${{ steps.parse.outputs.repo }}](https://github.com/${{ steps.parse.outputs.repo }}) to the unofficial device list.

            **Supported devices:** ${{ steps.parse.outputs.device }}

            Closes #${{ github.event.issue.number }}

      - name: Comment the pull request link
        if: steps.parse.outcome == 'success' && steps.pr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          gh issue comment "$ISSUE" --body "Thanks! Opened $PR_URL to add this entry. The page updates once it is merged."

      - name: Comment that the repository is already listed
        if: steps.parse.outcome == 'success' && steps.parse.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ steps.parse.outputs.repo }}
        run: |
          gh issue comment "$ISSUE" --body "\`$REPO\` is already on the [unofficial device list](https://kazesu.github.io/guide/unofficial-devices) with the same details, so there is nothing to change."

      - name: Comment the parse error
        if: steps.parse.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ERROR: ${{ steps.parse.outputs.error }}
        run: |
          gh issue comment "$ISSUE" --body "$(printf 'Could not add this device:\n\n> %s\n\nPlease edit the issue to match the **Add Device** form, then remove and re-add the `add-device` label to retry.' "$ERROR")"

      - name: Close the issue
        if: |
          steps.parse.outcome == 'success' &&
          (steps.pr.outputs.pull-request-url != '' || steps.parse.outputs.changed == 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE" --reason completed
